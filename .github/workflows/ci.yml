name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  # Rust: o binario unico `cade` + paridade byte-a-byte com o oraculo Python (tests/golden)
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace (inclui tests/paridade)
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
      - name: cargo build --release (target/release/cade)
        run: cargo build --release -p cade_cli
      - name: cade conformidade (motor Rust x goldens; Linux)
        if: runner.os == 'Linux'
        run: ./target/release/cade conformidade tests/conformidade

  # Release: a cada tag v*, compila o binario estatico (musl) e anexa ao GitHub Release
  # (instalacao sem clonar: baixar `cade-<tag>-x86_64-unknown-linux-musl` + SHA256SUMS)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: musl + build estatico
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p cade_cli --target x86_64-unknown-linux-musl
      - name: empacotar + checksum
        run: |
          mkdir -p dist
          nome="cade-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
          cp "target/x86_64-unknown-linux-musl/release/cade" "dist/$nome"
          strip "dist/$nome" 2>/dev/null || true
          (cd dist && sha256sum "$nome" > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: publicar no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Imagem Docker minima (so o binario `cade`, sem Wine) + conformidade dentro do container
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t cade .
      - name: cade conformidade no container
        run: docker run --rm -v "$PWD/tests/conformidade:/conformidade:ro" cade conformidade /conformidade
      - name: tamanho da imagem
        run: docker image ls cade

  # Python: ORACULO de paridade (sai quando o binario Rust tiver paridade total)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "0"   # garante que o codigo nao depende do modo UTF-8 do Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup (cargo + venv + deps + doctor) — sem Wine, sem CADe_SIMU, sem acervo
        run: python scripts/dev.py setup
      - name: Testes
        run: python scripts/dev.py test
      - name: Gate de todos os exemplos + eval golden
        run: python scripts/dev.py gate
      - name: MCP responde (handshake + tools/list)
        run: python tools/mcp_call.py cad_examples
